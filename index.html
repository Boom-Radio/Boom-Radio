<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/core.css">

    <link rel="stylesheet" href="css/components/header-nav.css">
    <link rel="stylesheet" href="css/components/site-footer.css">
    <link rel="stylesheet" href="css/components/carousel.css">
    <link rel="stylesheet" href="css/components/carousel-arrow-addon.css">

    <link rel="stylesheet" href="css/custom.css">
    <title>BOOM Radio</title>
    <script src="js/carousel-arrow-addon.js" defer></script>
    <script src="js/carousel-autoplay-addon.js" defer></script>
</head>
<body>
    <header class="site-header drawer-right">
        <div class="site-header__inner container">
            <a href="#" class="site-header__brand">
                <img src="img/boom-black.png" alt="Site Logo">
            </a>
            <button type="button" class="site-header__toggle" popovertarget="site-nav" aria-label="Menu">
                <span aria-hidden="true">☰</span>
                <span class="visually-hidden">Menu</span>
            </button>
            <nav id="site-nav" class="site-nav" popover aria-label="Main navigation">
                <a href="#" class="site-nav__link">Home</a>
                <a href="#" class="site-nav__link">Hosts</a>
                <a href="#" class="site-nav__link">About</a>
                <a href="#" class="site-nav__link">News</a>
                <a href="#" class="site-nav__link btn-general btn-cta"><span class="dot"></span>On Air: Listen Live</a>
            </nav>
        </div>
    </header>
    <main>
        <section class="carousel container" data-carousel-autoplay aria-label="Example content carousel" aria-roledescription="carousel">
            <button type="button" class="carousel-autoplay-toggle" hidden>Pause</button>
            <div class="carousel__track" tabindex="0">
            <article class="carousel__slide grid items-center" aria-roledescription="slide" aria-label="1 of 3">
                <figure class="carousel__media"><img src="img/boom-black.png" alt="Logo" loading="lazy"></figure>
            </article>
            <article class="carousel__slide grid items-center" aria-roledescription="slide" aria-label="2 of 3">
                <figure class="carousel__media"><img src="img/boom-white.png" alt="Logo" loading="lazy"></figure>
            </article>
            <article class="carousel__slide grid items-center" aria-roledescription="slide" aria-label="3 of 3">
                <figure class="carousel__media"><img src="img/boom-white.png" alt="Logo" loading="lazy"></figure>
            </article>
            </div>
            <div class="carousel__copy stack">
                <h1>NOT JUST NOISE</h1>
            </div>
            <div class="carousel__status visually-hidden" aria-live="polite" aria-atomic="true" hidden></div>
            <button type="button" class="carousel__control carousel__control--prev" aria-label="Previous slide"></button>
            <button type="button" class="carousel__control carousel__control--next" aria-label="Next slide"></button>
        </section>
    </main>
    <footer class="site-footer">
        <div class="container site-footer__content cluster">
            <section class="footer-block stack">
                <img class="site-footer__logo" src="img/boom-white.png" alt="Site logo">
                <p class="site-footer__copyright">&copy; 2026 Boom Radio. All rights reserved.</p>
            </section>
            <section class="footer-block stack">
                <h3>USEFUL LINKS</h3>
                <nav class="site-footer__nav" aria-labelledby="Footer navigation">
                    <a href="#">Home</a>
                    <a href="#">Hosts and Schedule</a>
                    <a href="#">About Us</a>
                    <a href="#">Latest News</a>
                </nav>
            </section>
            <section class="footer-block stack">
                <h3>FOLLOW US</h3>
                <nav class="site-footer__nav" aria-label="Footer navigation">
                    <a href="#">Facebook</a>
                    <a href="#">Instagram</a>
                    <a href="#">TikTok</a>
                </nav>
            </section>
            <article class="footer-block stack">
                <h3>CONTACT DETAILS</h3>
                <section class="contact">
                    <p>boomradioau@gmail.com</p>
                    <p>9443 2236</p>
                    <p>Leederville, Perth (WA)</p>
                </section>
            </article>
        </div>
    </footer>
</body>
</html>
